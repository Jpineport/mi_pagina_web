<!DOCTYPE html>
<html lang=es>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruins of Lordaeron</title>
    <style>
        body {

            background-image: url(../imagenes/RoL_hall.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Times New Roman', Times, serif;
            margin: 50;
            padding: 0;

            ul {
                list-style: none;
            }

            a {
                text-decoration: none;
                color: inherit;
            }
        }

        header {
            background-image: url(../imagenes/RoL.png);
            padding: 20px;
            text-align: center;
        }

        header img {
            border-radius: 50%;
        }

        header h1 {
            margin: 10px 0;
            color: #f7f7f7;
        }

        header p {
            margin: 5px 0;
        }

        header ul {
            list-style-type: none;
            padding: 0;
        }

        header ul li {
            display: inline-block;
            margin-right: 10px;
        }

        section {
            background-color: #000f08;
            margin-top: 100px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px;
            font-size: 20px;
            color: #f7f7f7;
            text-indent: 40px;


        }

        section img {
            display: block;
            margin-top: 10px;

        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #000000;
            border: 1px solid #034129;
        }

        th,
        td {
            padding: 11px 9px;
            text-align: left;
            border-bottom: 1px solid #053520;
            vertical-align: top;
            line-height: 1.8;
        }

        th {
            background-color: #033327;
            font-weight: bold;
            white-space: nowrap;
        }

        .Quest {
            color: #ffcc00;
        }

        .Nivel {
            text-align: center;
        }

        .Faccion {
            text-align: center;
            color: #c19a54;
        }

        .yellow {
            color: #ffdf00;
            font-weight: bold;
        }

        .boss-image {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            margin: 25px auto;
            border-radius: 10px;
        }

        .footer-image {
            display: block;
            width: 100%;
            max-width: 300px;
            height: auto;
            margin: 5px 0 20px 5px;
        }

        .blue {
            color: #14599e;
        }

        .green {
            color: #1cc546;
        }
    </style>
</head>
